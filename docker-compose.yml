# ============================================================
# laolao-code 一键容器化部署编排（服务器）
# 包含：Nginx + Spring Boot 后端 + MySQL + Redis + RocketMQ
# RocketMQ 调优参数与本地开发编排 docker/docker-compose.yml 保持一致，
# 两份编排共用 docker/rmq-proxy.json，仅网络、自启策略和端口暴露不同
#
# 部署步骤：
#   1. 先在宿主机构建判题镜像（判题容器由后端在宿主机 Docker 上动态创建）
#      docker build -t judger ./docker/judger
#   2. docker compose up -d --build
# ============================================================

services:
  # ============ 中间件 ============
  mysql:
    image: mysql:8.0
    container_name: laolao-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: laolao_root_123456      # 建议改成强密码
      MYSQL_DATABASE: laolao_code
      MYSQL_USER: laolao
      MYSQL_PASSWORD: 293576                # 与 application-docker.yaml 保持一致
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建库建表 + 导入数据（仅空数据卷时执行）
      - ./laolao_code.sql:/docker-entrypoint-initdb.d/laolao_code.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - laolao-net

  redis:
    image: redis:6-alpine
    container_name: laolao-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - laolao-net

  # ============ RocketMQ（调优参数与 docker/docker-compose.yml 完全一致） ============
  namesrv:
    image: apache/rocketmq:5.4.0
    container_name: rmqnamesrv
    restart: unless-stopped
    ports:
      - 9876:9876
    environment:
      # 压榨到 128M 堆内存，NameServer 够用
      - JAVA_OPT_EXT=-Xms128m -Xmx128m
    # 限制 Docker 容器物理内存
    deploy:
      resources:
        limits:
          memory: 256M  # 物理内存给 256M
    command: sh mqnamesrv
    networks:
      - laolao-net

  broker:
    image: apache/rocketmq:5.4.0
    container_name: rmqbroker
    restart: unless-stopped
    ports:
      - 10909:10909
      - 10911:10911
      - 10912:10912
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
      # 堆给 256M，堆外(直接内存)给 256M，共 512M 左右逻辑占用
      - JAVA_OPT_EXT=-Xms256m -Xmx256m -XX:MaxDirectMemorySize=256m
    deploy:
      resources:
        limits:
          memory: 768M  # 物理内存给 768M（留出系统 Buffer）
    depends_on:
      - namesrv
    command: sh mqbroker
    networks:
      - laolao-net

  # ============================================================
  # 初始化 Topic 容器：broker 启动 15s 后自动创建需要的 Topic
  # Consumer 启动前 Topic 必须存在，否则会报 No topic route info
  # RocketMQ 5.x 用 -a 属性指定消息类型：DELAY=定时, NORMAL=普通
  # ============================================================
  init-topic:
    image: apache/rocketmq:5.4.0
    container_name: rmqinit
    depends_on:
      - broker
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    entrypoint: >
      sh -c "
        sleep 15 &&
        sh mqadmin updateTopic -n rmqnamesrv:9876 -t ExamEndTopic -c DefaultCluster -a +message.type=DELAY &&
        sh mqadmin updateTopic -n rmqnamesrv:9876 -t JudgeTopic -c DefaultCluster -a +message.type=NORMAL
      "
    networks:
      - laolao-net

  proxy:
    image: apache/rocketmq:5.4.0
    container_name: rmqproxy
    restart: unless-stopped
    depends_on:
      - broker
      - namesrv
    ports:
      - 9080:9080
      - 9081:9081
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
      # Proxy 主要是转发，给 256M 堆和 128M 堆外即可
      - JAVA_OPT_EXT=-Xms256m -Xmx256m -XX:MaxDirectMemorySize=128m
    deploy:
      resources:
        limits:
          memory: 512M  # 物理内存给 512M
    volumes:
      # 挂载自定义的 Proxy 配置（与本地开发编排 docker/docker-compose.yml 共用同一份）
      - ./docker/rmq-proxy.json:/home/rocketmq/rocketmq-5.4.0/conf/rmq-proxy.json:ro
    command: sh mqproxy -pc /home/rocketmq/rocketmq-5.4.0/conf/rmq-proxy.json
    networks:
      - laolao-net

  # 内存紧张(2G 服务器)时可整段删除，省约 400M
  dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rmqdashboard
    restart: unless-stopped
    ports:
      - 9877:8082
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
      # Dashboard 是 SpringBoot，256M 是比较经济的配置
      - JAVA_OPTS=-Xms256m -Xmx256m
    deploy:
      resources:
        limits:
          # 容器物理内存限制，比堆内存大 256M 左右即可
          memory: 400M  # 物理内存给 400M
    networks:
      - laolao-net

  # ============ 应用 ============
  backend:
    build: ./laolao-code
    image: laolao-backend
    container_name: laolao-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: docker
      # 保证 JVM 时区与数据库、宿主机一致
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
    volumes:
      # 判题沙箱：后端通过宿主机 Docker 守护进程创建 judger 容器（DooD 模式）
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 等 Topic 初始化完成再启动，避免 No topic route info
      init-topic:
        condition: service_completed_successfully
    networks:
      - laolao-net

  nginx:
    image: nginx:1.27-alpine
    container_name: laolao-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./laolao-code-vue/dist:/usr/share/nginx/html:ro
      - ./docker/nginx/laolao.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - laolao-net

networks:
  laolao-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
