# laolao-code 前端 + 反向代理配置（容器版）
# backend 是 docker-compose.yml 里的后端服务名
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # 后端 API（含 SSE 流式响应，必须关掉缓冲）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # WebSocket（判题结果推送）
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # 必须透传真实 Host，否则后端收到的 Host 是 backend:8080，
        # 与浏览器 Origin 不一致会被 Spring CorsFilter 误判为跨域拒绝（403 Invalid CORS request）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 前端 history 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
